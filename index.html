<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PicPick｜可直接開啟版</title>
    <style>
:root {
  color: #17202a;
  background: #f7f5f0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; min-height: 100vh; }
button, input, select { font: inherit; }
button { border: 1px solid #e5dfd5; background: #fff; color: #1b2430; border-radius: 16px; padding: 12px 16px; cursor: pointer; transition: .2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
button:hover { transform: translateY(-1px); border-color: #d0b992; box-shadow: 0 10px 30px rgba(50, 38, 20, .08); }
.primary { background: #17202a; color: #fff; border-color: #17202a; }
.app-shell { min-height: 100vh; background: radial-gradient(circle at top left, #fff1d8 0, transparent 30%), linear-gradient(135deg, #f9f6ef, #eef2f4); }
.topbar { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(14px); background: rgba(247,245,240,.82); border-bottom: 1px solid rgba(229,223,213,.75); display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(16px, 4vw, 48px); }
.brand { border: 0; background: transparent; font-weight: 900; font-size: 22px; padding: 8px; }
.nav-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.nav-actions button { padding: 10px 14px; }
.hero-grid, .page-wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 72px; }
.hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.hero-card, .mode-card, .panel, .prompt-box, .preset-card, .empty { background: rgba(255,255,255,.82); border: 1px solid rgba(229,223,213,.9); border-radius: 28px; box-shadow: 0 24px 80px rgba(60, 45, 22, .08); }
.hero-main { grid-column: 1 / -1; padding: clamp(28px, 5vw, 64px); min-height: 410px; display: flex; flex-direction: column; justify-content: center; }
.eyebrow { color: #9a6a2f; font-weight: 800; letter-spacing: .08em; font-size: 13px; }
h1 { margin: 12px 0; font-size: clamp(34px, 6vw, 68px); line-height: 1.02; letter-spacing: -0.05em; }
p { line-height: 1.8; color: #5c6672; }
.hero-main p { max-width: 760px; font-size: 18px; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
.mode-card { min-height: 280px; text-align: left; align-items: flex-start; flex-direction: column; padding: 28px; }
.mode-card h3 { font-size: 26px; margin: 10px 0 4px; }
.mode-card span { margin-top: auto; color: #9a6a2f; font-weight: 800; }
.mode-icon { width: 54px; height: 54px; border-radius: 18px; background: #f5ead8; display: grid; place-items: center; color: #9a6a2f; }
.page-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 22px; }
.page-header h1 { font-size: clamp(30px, 4vw, 48px); }
.generator-grid { display: grid; grid-template-columns: 330px 1fr; gap: 18px; align-items: start; }
.panel-list { display: grid; gap: 14px; }
.sticky-preview { position: sticky; top: 92px; padding: 18px; }
details.panel { overflow: hidden; }
.panel summary { cursor: pointer; padding: 20px 24px; font-weight: 900; font-size: 20px; list-style: none; }
.panel summary::-webkit-details-marker { display: none; }
.panel-body { padding: 0 24px 24px; display: grid; gap: 18px; }
.upload-box { border: 1.5px dashed #d9c6a6; border-radius: 24px; padding: 28px; display: grid; gap: 8px; place-items: center; text-align: center; background: #fffaf4; cursor: pointer; }
.upload-box input { display: none; }
.preview-card { margin-top: 16px; border-radius: 26px; padding: 16px; min-height: 320px; border: 1px solid #e8ded0; }
.mock-photo { height: 260px; border-radius: 20px; background: linear-gradient(135deg, #ece3d6, #ffffff); display: grid; place-items: center; overflow: hidden; color: #9a6a2f; }
.mock-photo img { width: 100%; height: 100%; object-fit: cover; }
.swatches { display: flex; gap: 8px; margin-top: 12px; }
.swatches i, .palette-grid i { width: 22px; height: 22px; border-radius: 999px; border: 1px solid rgba(0,0,0,.08); display: inline-block; }
.option-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.option-grid.compact { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.option-grid button { align-items: flex-start; text-align: left; flex-direction: column; min-height: 118px; }
.option-grid.compact button { min-height: auto; }
.option-grid span { color: #6a7580; font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.selected, .tabs .active, .palette-grid .selected { border-color: #17202a !important; background: #fff8e9 !important; box-shadow: inset 0 0 0 1px #17202a; }
.select-row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: center; }
.select-row span { font-weight: 800; }
select, input.search, .text-fields input { border: 1px solid #e3dbcf; border-radius: 16px; padding: 12px 14px; background: #fff; min-width: 0; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.tabs button { white-space: nowrap; padding: 10px 12px; }
.palette-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.palette-grid button { flex-direction: column; align-items: flex-start; }
.palette-grid div { display: flex; gap: 4px; margin-top: 8px; }
.slider-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.slider { background: #fff; border: 1px solid #e8ded0; border-radius: 18px; padding: 14px; }
.slider div, .slider small { display: flex; justify-content: space-between; gap: 12px; }
.slider b { color: #9a6a2f; }
.slider input { width: 100%; accent-color: #17202a; }
.slider small { color: #6d7680; }
.slider em { font-style: normal; }
.switch { display: flex; gap: 10px; align-items: center; font-weight: 900; }
.text-fields { display: grid; gap: 12px; }
.result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.prompt-box { padding: 20px; }
.prompt-box > div { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 8px; }
.prompt-box h3 { margin: 0; }
pre { white-space: pre-wrap; word-break: break-word; background: #fbf8f1; border: 1px solid #eee3d2; border-radius: 18px; padding: 16px; line-height: 1.75; max-height: 430px; overflow: auto; }
.library-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.preset-card { padding: 22px; display: grid; gap: 10px; }
.preset-card > span { color: #9a6a2f; font-weight: 900; }
.preset-card h3 { margin: 0; }
.preset-card div { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { padding: 42px; text-align: center; color: #687380; }
@media (max-width: 860px) {
  .topbar, .page-header { align-items: flex-start; flex-direction: column; }
  .hero-grid, .generator-grid, .result-grid { grid-template-columns: 1fr; }
  .sticky-preview { position: static; }
  .nav-actions { width: 100%; }
  .nav-actions button { flex: 1; padding: 10px 8px; font-size: 14px; }
  .select-row { grid-template-columns: 1fr; }
}

  <body>
    <div id="root"></div>
    <script>
const photoTypes = [
    { id: 'single', label: '單人', prompt: '以單一人物為主體，保留五官辨識度、個人氣場與自然表情' },
    { id: 'couple', label: '雙人', prompt: '強調雙人互動、比例一致與構圖平衡，避免人物特徵混淆' },
    { id: 'multi', label: '多人', prompt: '維持每位人物的辨識度與群體層次，避免撞臉與姿勢重疊' },
    { id: 'group', label: '團體', prompt: '呈現整齊群像排列、清楚前後層次與一致的視覺風格' },
    { id: 'product', label: '商品', prompt: '以商品展示為核心，強調材質、細節、商業感與乾淨背景' },
    { id: 'pet', label: '寵物', prompt: '保留動物特徵與可愛神韻，讓風格一致且自然討喜' },
    { id: 'space', label: '風景 / 空間', prompt: '強調空間氛圍、場景調性、景深與構圖感' }
];
const ageModes = [
    '保留原年紀,幼兒,兒童,國小生,國中生,高中生,大學生,20代,30代,40代,50代,60代,銀髮族,年輕化,成熟化,兒童化,銀髮化,不改年紀，只調整氣質'
        .split(',')
        .map((label, index) => ({ id: `age-${index}`, label, prompt: label === '保留原年紀' ? '保留照片中人物原本年紀' : `將年紀表現調整為${label}` }))
].flat();
const styleCategories = [
    '寫實攝影類,日韓質感類,商業形象類,動畫插畫類,潮流酷炫類,復古懷舊類,奇幻變身類,社群爆款類,東方風格類,情緒氛圍類'
        .split(',')
        .map((label, index) => ({ id: `style-cat-${index + 1}`, label, prompt: `${label}的整體視覺語言` }))
].flat();
const styleSeeds = ['自然人像攝影', '柔焦韓系棚拍', '高級商業形象照', '日系清透明亮', '電影劇照感', '極簡品牌主視覺', '二次元精緻插畫', '潮流霓虹海報', '復古膠片雜誌', '新中式雅緻'];
const styles = Array.from({ length: 200 }, (_, index) => {
    const category = styleCategories[index % styleCategories.length];
    const seed = styleSeeds[index % styleSeeds.length];
    return {
        id: `style-${String(index + 1).padStart(3, '0')}`,
        label: `${seed} ${index + 1}`,
        category: category.id,
        prompt: `${category.label}，${seed}，具備一致美術方向與可直接用於 AI 修圖的視覺描述`
    };
});
const lights = [
    ['基礎光', '自然光', '柔和窗光', '棚拍白光', '室內暖光', '陰天散射光'],
    ['情緒光', '黃昏逆光', '電影感側光', '戲劇追光', '夜景霓虹光', '柔霧夢幻光', '燭光感', '月光感', '暗調電影光'],
    ['商業光', '精品硬光', '保養品柔膚光', '產品主視覺光', '展示櫥窗光', '高級商攝光']
].flatMap(([category, ...items]) => items.map((label, index) => ({ id: `${category}-${index}`, label, category, prompt: `使用${label}，光影自然合理並符合${category}調性` })));
const makeOptions = (prefix, categories, count, samples) => Array.from({ length: count }, (_, index) => {
    const category = categories[index % categories.length];
    const label = samples[index % samples.length];
    return { id: `${prefix}-${index + 1}`, label: `${label}${count > samples.length ? ` ${index + 1}` : ''}`, category, prompt: `${category}中的${label}設定，細節清楚且與照片主體協調` };
});
const locations = makeOptions('location', ['攝影棚', '咖啡廳', '街頭', '商辦空間', '百貨商場', '家居空間', '校園', '大自然', '旅遊場景', '特殊主題場景'], 100, ['純白棚景', '木質咖啡廳', '城市街角', '高級辦公室', '精品商場', '溫暖客廳', '校園走廊', '森林步道', '海邊旅拍', '未來太空艙']);
const outfits = makeOptions('outfit', ['男裝', '女裝', '男女搭配', '雙人搭配', '多人群體搭配', '情侶搭配', '商務搭配', '主題造型搭配', '保留原服裝', '自動換裝'], 100, ['保留原服裝', '韓系襯衫', '商務西裝', '街頭外套', '優雅禮服', '休閒針織', '可愛學院風', '高級時尚套裝', '情侶同色系', '主題變裝']);
const accessories = makeOptions('accessory', ['個人形象配件', '商務專業配件', '攝影創作配件', '時尚潮流配件', '生活日常配件', '運動健康配件', '奇幻變身配件', '復古懷舊配件', '社群拍攝配件', '節慶主題配件'], 100, ['不加配件', '保留原配件', '眼鏡', '帽子', '相機', '包包', '花束', '咖啡杯', '珍珠耳環', '節慶燈飾']);
const accessoryModes = ['不加配件', '保留原配件', '替換配件', '新增 1 個配件', '新增 2–3 個配件', '主題配件組合'].map((label, index) => ({ id: `accessory-mode-${index}`, label, prompt: label }));
const colorPalettes = makeOptions('palette', ['奶油色', '黑金', '粉色', '藍灰', '莫蘭迪', '復古棕', '霓虹色', '森林綠', '海鹽藍', '玫瑰金'], 100, ['柔奶油', '黑金精品', '淡粉甜感', '藍灰專業', '莫蘭迪柔霧', '復古棕調', '霓虹撞色', '森林自然', '海鹽清新', '玫瑰金']).map((option, index) => ({
    ...option,
    colors: { primary: ['#f5e6c8', '#101010', '#f7b8c8', '#6f8095', '#9aa48f'][index % 5], secondary: '#ffffff', accent: ['#d8a64f', '#d4af37', '#ff6f91', '#9fb4c7', '#c8b7a6'][index % 5], background: ['#fffaf0', '#f3f0ea', '#fff4f6', '#edf3f8', '#f2f0ec'][index % 5], text: ['#573b2a', '#f7d57a', '#63303e', '#263747', '#4b4b42'][index % 5] }
}));
const moods = makeOptions('mood', ['療癒溫柔系', '高級質感系', '電影敘事系', '浪漫情感系', '潮流個性系', '奇幻夢境系', '復古懷舊系', '活力歡樂系', '情緒深層系', '氣勢場域系'], 100, ['高級', '溫柔', '浪漫', '酷炫', '活力', '神秘', '療癒', '專業', '沉靜', '自信']);
const frames = makeOptions('frame', ['極簡框線', '高級精品框線', '韓系日系框線', '社群框線', '可愛活潑框線', '復古框線', '奇幻主題框線', '商業用途框線', '專業人物框線', '文字版型框線'], 100, ['無框線', '細白框', '細黑框', '雜誌框', '拍立得框', '可愛框', '精品金線', '資訊卡框線', '霧面留白框', '海報分割線']);
const layouts = makeOptions('layout', ['無文字型', '輕文字型', '重文字型'], 50, ['純圖片', '滿版主視覺', '留白海報式', '雜誌感純圖', '拼貼構圖', '上標題下圖片', '下標題上圖片', '左文右圖', '右文左圖', '簡約封面式', '商品 DM', '活動宣傳', '課程招生', '品牌海報', '雜誌封面', '內頁版型', '名言卡', '資訊卡']);
const outputs = makeOptions('output', ['社群貼文', '限時動態', '短影音封面', '商品廣告', '個人品牌', '商務履歷', '官網 / Banner', '印刷輸出', '課程 / 簡報', '內容創作封面'], 100, ['IG貼文', 'IG限動', 'FB貼文', '個人品牌照', '商品廣告', '海報', '履歷照', '網站橫幅', '簡報封面', 'YouTube封面']);
const textStyles = ['極簡現代', '高級精品', '韓系清新', '日系文青', '商務正式', '潮流個性', '可愛活潑', '復古海報', '科技未來', '新中式'].map((label, index) => ({ id: `text-style-${index}`, label, prompt: `${label}字體風格，文字清楚可讀且與圖片融合` }));
const basicSliders = [
    { key: 'identity', label: '人物保留度', minLabel: '自由改造', maxLabel: '高度保留' },
    { key: 'retouch', label: '修飾強度', minLabel: '自然', maxLabel: '精修' },
    { key: 'background', label: '背景變化程度', minLabel: '保留', maxLabel: '重塑' },
    { key: 'realism', label: '寫實 / 插畫程度', minLabel: '寫實', maxLabel: '插畫' },
    { key: 'color', label: '色彩濃度', minLabel: '淡雅', maxLabel: '鮮明' },
    { key: 'polish', label: '精緻程度', minLabel: '生活感', maxLabel: '高完成度' }
];
const expertSliders = [
    ...basicSliders,
    { key: 'cinematic', label: '電影感', minLabel: '日常', maxLabel: '電影級' },
    { key: 'mood', label: '氛圍強度', minLabel: '輕微', maxLabel: '強烈' },
    { key: 'clarity', label: '細節清晰度', minLabel: '柔和', maxLabel: '銳利' },
    { key: 'creative', label: '創意變形程度', minLabel: '保守', maxLabel: '大膽' },
    { key: 'composition', label: '構圖自由度', minLabel: '依原圖', maxLabel: '重構圖' },
    { key: 'textPresence', label: '文字存在感', minLabel: '低調', maxLabel: '醒目' },
    { key: 'textBlend', label: '圖文融合度', minLabel: '獨立', maxLabel: '融合' },
    { key: 'framePresence', label: '框線存在感', minLabel: '低調', maxLabel: '強烈' }
];
const frameSliders = [
    { key: 'frameThickness', label: '框線粗細', minLabel: '細', maxLabel: '粗' },
    { key: 'frameOpacity', label: '框線透明度', minLabel: '透明', maxLabel: '不透明' },
    { key: 'frameRadius', label: '圓角程度', minLabel: '直角', maxLabel: '圓角' },
    { key: 'frameDecoration', label: '框線裝飾感', minLabel: '極簡', maxLabel: '華麗' },
    { key: 'frameWhitespace', label: '留白寬度', minLabel: '窄', maxLabel: '寬' },
    { key: 'frameShadow', label: '陰影強度', minLabel: '無', maxLabel: '明顯' }
];
const textSliders = [
    { key: 'fontSize', label: '文字大小', minLabel: '小', maxLabel: '大' },
    { key: 'fontWeight', label: '文字粗細', minLabel: '細', maxLabel: '粗' },
    { key: 'letterSpacing', label: '字距', minLabel: '緊', maxLabel: '寬' },
    { key: 'lineHeight', label: '行距', minLabel: '緊', maxLabel: '鬆' },
    { key: 'textPresence', label: '文字存在感', minLabel: '低調', maxLabel: '醒目' },
    { key: 'textBlend', label: '圖文融合度', minLabel: '獨立', maxLabel: '融合' }
];


const findLabel = (items, id) => items.find((item) => item.id === id) ?? items[0];
const level = (value) => (value >= 75 ? '高' : value >= 45 ? '中' : '低');
const sliderNames = {
    identity: '人物保留度', retouch: '修飾強度', background: '背景重塑程度', realism: '寫實/插畫程度', color: '色彩濃度', polish: '精緻程度', cinematic: '電影感', mood: '氛圍強度', clarity: '細節清晰度', creative: '創意變形程度', composition: '構圖自由度', textPresence: '文字存在感', textBlend: '圖文融合度', framePresence: '框線存在感', frameThickness: '框線粗細', frameOpacity: '框線透明度', frameRadius: '圓角程度', frameDecoration: '框線裝飾感', frameWhitespace: '留白寬度', frameShadow: '陰影強度', fontSize: '文字大小', fontWeight: '文字粗細', letterSpacing: '字距', lineHeight: '行距'
};
const createInitialState = (mode) => ({
    mode,
    photoType: 'single',
    age: 'age-0',
    styleCategory: 'style-cat-1',
    style: 'style-001',
    light: '基礎光-0',
    location: 'location-1',
    outfit: 'outfit-1',
    accessoryMode: 'accessory-mode-0',
    accessory: 'accessory-1',
    palette: 'palette-1',
    mood: 'mood-1',
    frame: 'frame-1',
    layout: 'layout-1',
    output: 'output-1',
    textStyle: 'text-style-0',
    text: { enabled: false, title: '', subtitle: '', body: '', slogan: '', cta: '', brand: '', details: '', note: '', align: '置中' },
    sliders: {
        identity: 80, retouch: 45, background: 35, realism: 35, color: 55, polish: 65, cinematic: 45, mood: 50, clarity: 65, creative: 30, composition: 35, textPresence: 45, textBlend: 55, framePresence: 30, frameThickness: 30, frameOpacity: 70, frameRadius: 30, frameDecoration: 20, frameWhitespace: 35, frameShadow: 25, fontSize: 50, fontWeight: 50, letterSpacing: 45, lineHeight: 50
    }
});
const assemblePrompt = (state) => {
    const photoType = findLabel(photoTypes, state.photoType);
    const age = findLabel(ageModes, state.age);
    const style = findLabel(styles, state.style);
    const light = findLabel(lights, state.light);
    const location = findLabel(locations, state.location);
    const outfit = findLabel(outfits, state.outfit);
    const accessoryMode = findLabel(accessoryModes, state.accessoryMode);
    const accessory = findLabel(accessories, state.accessory);
    const palette = findLabel(colorPalettes, state.palette);
    const mood = findLabel(moods, state.mood);
    const frame = findLabel(frames, state.frame);
    const layout = findLabel(layouts, state.layout);
    const output = findLabel(outputs, state.output);
    const textStyle = findLabel(textStyles, state.textStyle);
    const textParts = state.text.enabled
        ? [
            state.text.title && `主標題「${state.text.title}」`,
            state.text.subtitle && `副標題「${state.text.subtitle}」`,
            state.text.body && `內文「${state.text.body}」`,
            state.text.slogan && `重點標語「${state.text.slogan}」`,
            state.text.cta && `CTA「${state.text.cta}」`,
            state.text.brand && `名稱/品牌「${state.text.brand}」`,
            state.text.details && `日期地點價格聯絡資訊「${state.text.details}」`,
            state.text.note && `備註「${state.text.note}」`,
            `${state.text.align}，${textStyle.prompt}`
        ].filter(Boolean).join('；')
        : '不加入任何文字，保持畫面乾淨';
    const sliderSummary = Object.entries(state.sliders)
        .filter(([key]) => state.mode === 'expert' || ['identity', 'retouch', 'background', 'realism', 'color', 'polish'].includes(key))
        .map(([key, value]) => `${sliderNames[key]}${level(value)}`)
        .join('、');
    const frameDetails = `框線參數：粗細${state.sliders.frameThickness}、透明度${state.sliders.frameOpacity}、圓角${state.sliders.frameRadius}、裝飾感${state.sliders.frameDecoration}、留白${state.sliders.frameWhitespace}、陰影${state.sliders.frameShadow}`;
    const fullPrompt = [
        '請根據上傳照片進行 AI 照片編輯，不要把照片當成全新創作。',
        photoType.prompt,
        age.prompt,
        style.prompt,
        light.prompt,
        location.prompt,
        outfit.prompt,
        `${accessoryMode.prompt}：${accessory.prompt}`,
        `配色採用${palette.label}，主色 ${palette.colors.primary}、輔色 ${palette.colors.secondary}、點綴色 ${palette.colors.accent}、背景色 ${palette.colors.background}、建議文字色 ${palette.colors.text}`,
        mood.prompt,
        `${frame.prompt}，${frameDetails}`,
        layout.prompt,
        `輸出用途：${output.prompt}`,
        `文字內容：${textParts}`,
        `微調要求：${sliderSummary}。請保持五官自然、手部合理、材質清楚、光線一致、構圖乾淨，輸出高解析且適合直接用於${output.label}。`
    ].join('\n');
    const shortPrompt = `將照片轉為${style.label}，${photoType.label}，${age.label}，${light.label}，${location.label}，${palette.label}配色，${mood.label}氛圍，${layout.label}，用途為${output.label}。${state.text.enabled ? `加入文字：${textParts}。` : '不加文字。'}`;
    const negativePrompt = '避免五官變形、手指錯誤、低畫質、構圖擁擠、文字錯字、比例怪異、人物撞臉、背景雜亂、光線不合理、過度磨皮、塑膠皮膚、邊緣破碎、框線誤判成外框、文字遮住主體。';
    const codeNumber = Math.abs([...`${state.style}${state.palette}${state.mood}${state.output}`].reduce((sum, char) => sum + char.charCodeAt(0), 0)) % 999;
    const styleCode = `${state.mode === 'expert' ? 'PP-BRAND' : 'PP-STYLE'}-${String(codeNumber || 83).padStart(3, '0')}`;
    return { fullPrompt, shortPrompt, negativePrompt, styleCode };
};


const KEY = 'picpick_user_presets';
const loadPresets = () => {
    try {
        const raw = localStorage.getItem(KEY);
        return raw ? JSON.parse(raw) : [];
    }
    catch {
        return [];
    }
};
const savePresets = (presets) => localStorage.setItem(KEY, JSON.stringify(presets));
const upsertPreset = (preset) => {
    const next = [preset, ...loadPresets().filter((item) => item.id !== preset.id)];
    savePresets(next);
    return next;
};
const deletePreset = (id) => {
    const next = loadPresets().filter((item) => item.id !== id);
    savePresets(next);
    return next;
};


const root = document.querySelector('#root');
let page = 'home';
let state = createInitialState('basic');
let result = assemblePrompt(state);
const basicIds = {
    location: ['location-1', 'location-2', 'location-3', 'location-6', 'location-8', 'location-10'],
    outfit: ['outfit-1', 'outfit-2', 'outfit-3', 'outfit-4', 'outfit-5', 'outfit-6', 'outfit-7', 'outfit-8'],
    accessory: ['accessory-1', 'accessory-2', 'accessory-3', 'accessory-4', 'accessory-5', 'accessory-6', 'accessory-7', 'accessory-8'],
    palette: ['palette-1', 'palette-2', 'palette-3', 'palette-4', 'palette-5', 'palette-6', 'palette-7'],
    mood: ['mood-1', 'mood-2', 'mood-3', 'mood-4', 'mood-5', 'mood-6', 'mood-7', 'mood-8'],
    frame: ['frame-1', 'frame-2', 'frame-3', 'frame-4', 'frame-5', 'frame-6'],
    layout: ['layout-1', 'layout-6', 'layout-8', 'layout-15', 'layout-11'],
    output: ['output-1', 'output-2', 'output-3', 'output-4', 'output-5', 'output-6', 'output-7']
};
const html = (strings, ...values) => strings.reduce((out, part, i) => out + part + String(values[i] ?? ''), '');
const esc = (value) => String(value ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const optionById = (items, id) => items.find((item) => item.id === id) ?? items[0];
const filterIds = (items, ids) => ids ? items.filter((item) => ids.includes(item.id)) : items;
function navigate(next) { page = next; render(); }
function start(mode, preset) { state = { ...(preset ?? createInitialState(mode)), mode }; navigate(mode); }
function generate() { result = assemblePrompt(state); navigate('result'); }
function update(key, value) { state = { ...state, [key]: value }; render(); }
function setSlider(key, value) { state = { ...state, sliders: { ...state.sliders, [key]: value } }; }
function shell(content) {
    root.innerHTML = html `<div class="app-shell"><nav class="topbar"><button class="brand" data-nav="home">✨ PicPick</button><div class="nav-actions"><button data-start="basic">快速生成</button><button data-start="expert">進階客製</button><button data-nav="library">我的風格庫</button></div></nav>${content}</div>`;
    bindCommon();
}
function bindCommon() {
    root.querySelectorAll('[data-nav]').forEach((el) => el.onclick = () => navigate(el.dataset.nav));
    root.querySelectorAll('[data-start]').forEach((el) => el.onclick = () => start(el.dataset.start));
}
function modeCard(icon, title, desc, action, data) {
    return html `<button class="mode-card" ${data}><div class="mode-icon">${icon}</div><h3>${title}</h3><p>${desc}</p><span>${action} →</span></button>`;
}
function renderHome() {
    shell(html `<main class="hero-grid"><section class="hero-card hero-main"><span class="eyebrow">AI 照片編輯提示詞生成器</span><h1>用選項與拉桿，快速生成可直接丟給 AI 工具的照片提示詞。</h1><p>PicPick 不是修圖軟體，而是把你的照片想法整理成完整、精簡、負面提示詞與專屬風格碼的創作助手。</p><div class="hero-actions"><button class="primary" data-start="basic">🚀 開始快速生成</button><button data-start="expert">🎚️ 進入高手版</button></div></section>${modeCard('🪄', '快速生成', '菜鳥版：只顯示大分類與常用選項，照著步驟選風格、微調、產提示詞。', '適合第一次使用', 'data-start="basic"')}${modeCard('🎚️', '進階客製', '高手版：完整模組展開，支援分類、搜尋、文字與框線細項，保留極高客製化彈性。', '適合 AI 創作者', 'data-start="expert"')}${modeCard('📚', '我的風格庫', '儲存常用組合、模板與風格碼，可再次套用、編輯或刪除。', '管理常用風格', 'data-nav="library"')}</main>`);
}
function optionGrid(items, selected, key, compact = false) {
    return html `<div class="option-grid ${compact ? 'compact' : ''}">${items.map((item) => html `<button data-update="${String(key)}" data-value="${item.id}" class="${selected === item.id ? 'selected' : ''}"><strong>${esc(item.label)}</strong>${compact ? '' : `<span>${esc(item.description ?? item.category ?? item.prompt)}</span>`}</button>`).join('')}</div>`;
}
function selectRow(label, items, value, key) {
    return html `<label class="select-row"><span>${label}</span><select data-select="${String(key)}">${items.map((item) => html `<option value="${item.id}" ${value === item.id ? 'selected' : ''}>${item.category ? `${esc(item.category)}｜` : ''}${esc(item.label)}</option>`).join('')}</select></label>`;
}
function sliders(configs) {
    return html `<div class="slider-grid">${configs.map((c) => html `<label class="slider"><div><span>${c.label}</span><b>${state.sliders[c.key]}</b></div><input data-slider="${c.key}" type="range" min="0" max="100" value="${state.sliders[c.key]}"><small>${c.minLabel}<em>${c.maxLabel}</em></small></label>`).join('')}</div>`;
}
function palettes(items) {
    return html `<div class="palette-grid">${items.map((p) => html `<button data-update="palette" data-value="${p.id}" class="${state.palette === p.id ? 'selected' : ''}"><span>${esc(p.label)}</span><div>${Object.values(p.colors).map((c) => `<i style="background:${c}"></i>`).join('')}</div></button>`).join('')}</div>`;
}
function panel(title, body, open = false) { return html `<details class="panel" ${open ? 'open' : ''}><summary>${title}</summary><div class="panel-body">${body}</div></details>`; }
function preview() {
    const palette = optionById(colorPalettes, state.palette);
    return html `<section class="panel sticky-preview"><label class="upload-box">⬆️<strong>上傳照片</strong><span>支援預覽，不會離開瀏覽器</span><input id="photoInput" type="file" accept="image/*"></label><div class="preview-card" style="background:${palette.colors.background}"><div class="mock-photo">${state.photoPreview ? `<img src="${state.photoPreview}" alt="照片預覽">` : '📷<span>照片預覽卡</span>'}</div><div class="swatches"><i style="background:${palette.colors.primary}"></i><i style="background:${palette.colors.accent}"></i><i style="background:${palette.colors.text}"></i></div></div></section>`;
}
function renderGenerator(mode) {
    const basic = mode === 'basic';
    const styleOptions = basic ? styleCategories : styles.filter((s) => s.category === state.styleCategory).slice(0, 30);
    shell(html `<main class="page-wrap"><header class="page-header"><div><span class="eyebrow">${basic ? '基礎客製化（菜鳥版）' : '極度客製化（高手版）'}</span><h1>${basic ? '三步驟快速產生提示詞' : '完整控制每個照片提示詞模組'}</h1><p>${basic ? '只保留最常用選項，先選風格，再用少量 BAR 微調。' : '所有模組完整展開，可分類篩選、搜尋與調整細節。'}</p></div><button class="primary" id="generateBtn">✨ 生成提示詞</button></header><div class="generator-grid">${preview()}<section class="panel-list">${panel('1. 照片類型 / 人物模式', optionGrid(photoTypes, state.photoType, 'photoType'), true)}${panel('2. 年紀與畫風', selectRow('年紀', ageModes, state.age, 'age') + (basic ? optionGrid(styleOptions, state.styleCategory, 'styleCategory') : `<div class="tabs">${styleCategories.map((c) => `<button data-update="styleCategory" data-value="${c.id}" class="${state.styleCategory === c.id ? 'active' : ''}">${c.label}</button>`).join('')}</div>${optionGrid(styleOptions, state.style, 'style')}`), true)}${panel('3. BAR 微調', sliders(basic ? basicSliders : expertSliders), true)}${panel('4. 光線、地點、服裝', selectRow('光線', basic ? lights.slice(0, 7) : lights, state.light, 'light') + selectRow('地點', filterIds(locations, basic ? basicIds.location : undefined), state.location, 'location') + selectRow('服裝', filterIds(outfits, basic ? basicIds.outfit : undefined), state.outfit, 'outfit'))}${panel('5. 配件、配色、氛圍', selectRow('配件模式', accessoryModes, state.accessoryMode, 'accessoryMode') + selectRow('配件', filterIds(accessories, basic ? basicIds.accessory : undefined), state.accessory, 'accessory') + palettes(filterIds(colorPalettes, basic ? basicIds.palette : undefined)) + selectRow('氛圍', filterIds(moods, basic ? basicIds.mood : undefined), state.mood, 'mood'))}${panel('6. 框線、排版、用途', optionGrid(filterIds(frames, basic ? basicIds.frame : undefined), state.frame, 'frame', true) + (basic ? '' : sliders(frameSliders)) + selectRow('排版', filterIds(layouts, basic ? basicIds.layout : undefined), state.layout, 'layout') + selectRow('用途', filterIds(outputs, basic ? basicIds.output : undefined), state.output, 'output'))}${panel('7. 文字內容（可選）', renderTextFields(basic))}</section></div></main>`);
    bindGenerator();
}
function renderTextFields(basic) {
    const fields = basic ? ['title', 'subtitle'] : ['title', 'subtitle', 'body', 'slogan', 'cta', 'brand', 'details', 'note'];
    const labels = { title: '主標題', subtitle: '副標題', body: '內文說明', slogan: '重點標語', cta: 'CTA 行動句', brand: '名字 / 品牌名 / 活動名', details: '日期 / 地點 / 價格 / 聯絡資訊', note: '備註文字' };
    return html `<label class="switch"><input id="textEnabled" type="checkbox" ${state.text.enabled ? 'checked' : ''}>要放文字嗎？</label>${state.text.enabled ? selectRow('字體風格', textStyles, state.textStyle, 'textStyle') + `<div class="text-fields">${fields.map((f) => `<input data-text="${f}" placeholder="${labels[f]}" value="${esc(state.text[f])}">`).join('')}</div>` + (basic ? '' : selectRow('對齊方式', ['左對齊', '置中', '右對齊'].map((label) => ({ id: label, label, prompt: label })), state.text.align, 'text.align') + sliders(textSliders)) : ''}`;
}
function bindGenerator() {
    bindCommon();
    root.querySelector('#generateBtn')?.addEventListener('click', generate);
    root.querySelector('#photoInput')?.addEventListener('change', (e) => { const file = e.target.files?.[0]; if (file)
        update('photoPreview', URL.createObjectURL(file)); });
    root.querySelectorAll('[data-update]').forEach((el) => el.onclick = () => { const key = el.dataset.update; const value = el.dataset.value; if (key === 'styleCategory') {
        state.style = styles.find((s) => s.category === value)?.id ?? state.style;
    } update(key, value); });
    root.querySelectorAll('[data-select]').forEach((el) => el.onchange = () => { if (el.dataset.select === 'text.align') {
        state.text.align = el.value;
        render();
    }
    else
        update(el.dataset.select, el.value); });
    root.querySelectorAll('[data-slider]').forEach((el) => el.oninput = () => { setSlider(el.dataset.slider, Number(el.value)); el.closest('.slider').querySelector('b').textContent = el.value; });
    root.querySelector('#textEnabled')?.addEventListener('change', (e) => { state.text.enabled = e.target.checked; render(); });
    root.querySelectorAll('[data-text]').forEach((el) => el.oninput = () => { state.text[el.dataset.text] = el.value; });
}
function promptBox(title, text, id) { return html `<section class="prompt-box"><div><h3>${title}</h3><button data-copy="${id}">📋 複製</button></div><pre>${esc(text)}</pre></section>`; }
function renderResult() {
    shell(html `<main class="page-wrap"><header class="page-header"><div><span class="eyebrow">結果頁</span><h1>已生成 4 種輸出</h1><p>風格碼：<strong>${result.styleCode}</strong><span id="copyMsg"></span></p></div><div class="hero-actions"><button data-nav="${state.mode}">返回編輯</button><button class="primary" id="regen">重新生成</button><button id="savePreset">💾 儲存我的風格</button></div></header><div class="result-grid">${promptBox('完整提示詞', result.fullPrompt, 'fullPrompt')}${promptBox('精簡提示詞', result.shortPrompt, 'shortPrompt')}${promptBox('負面提示詞', result.negativePrompt, 'negativePrompt')}${promptBox('專屬風格碼', result.styleCode, 'styleCode')}</div></main>`);
    bindCommon();
    root.querySelector('#regen')?.addEventListener('click', generate);
    root.querySelectorAll('[data-copy]').forEach((el) => el.onclick = async () => { await navigator.clipboard.writeText(result[el.dataset.copy]); root.querySelector('#copyMsg').textContent = '｜已複製'; });
    root.querySelector('#savePreset')?.addEventListener('click', () => { const name = window.prompt('請輸入風格名稱', `${result.styleCode} 常用風格`) ?? result.styleCode; upsertPreset({ id: crypto.randomUUID(), name, createdAt: new Date().toISOString(), state, result }); alert('已儲存到我的風格庫'); });
}
function renderLibrary() {
    const items = loadPresets().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    shell(html `<main class="page-wrap"><header class="page-header"><div><span class="eyebrow">我的風格庫</span><h1>常用設定與風格碼</h1><p>所有資料暫存在本機 localStorage，可套用、編輯或刪除。</p></div></header>${items.length === 0 ? '<section class="empty">尚未儲存風格。請先到結果頁按「儲存我的風格」。</section>' : `<div class="library-grid">${items.map((p) => `<article class="preset-card"><span>${p.result.styleCode}</span><h3>${esc(p.name)}</h3><p>${esc(p.result.shortPrompt)}</p><div><button class="primary" data-apply="${p.id}">再次套用</button><button data-edit="${p.id}">編輯</button><button data-delete="${p.id}">🗑️ 刪除</button></div></article>`).join('')}</div>`}</main>`);
    bindCommon();
    root.querySelectorAll('[data-apply]').forEach((el) => el.onclick = () => { const preset = loadPresets().find((p) => p.id === el.dataset.apply); start(preset.state.mode, preset.state); });
    root.querySelectorAll('[data-delete]').forEach((el) => el.onclick = () => { deletePreset(el.dataset.delete); renderLibrary(); });
    root.querySelectorAll('[data-edit]').forEach((el) => el.onclick = () => { const items = loadPresets(); const preset = items.find((p) => p.id === el.dataset.edit); const name = preset && window.prompt('編輯風格名稱', preset.name); if (preset && name) {
        preset.name = name;
        localStorage.setItem('picpick_user_presets', JSON.stringify(items));
        renderLibrary();
    } });
}
function render() { if (page === 'home')
    renderHome();
else if (page === 'result')
    renderResult();
else if (page === 'library')
    renderLibrary();
else
    renderGenerator(page); }
render();

    </script>
